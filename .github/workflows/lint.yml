name: Лінтер

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v7

      - name: Встановити Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Встановити flake8
        run: pip install flake8==7.3.0

      - name: Перевірити код
        run: flake8 . --extend-ignore=W291,W292,W293,W391 --show-source --statistics